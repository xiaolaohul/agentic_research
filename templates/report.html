<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ · RAG 实验室</title>
<style>
:root{--bg:#f3f5f7;--ink:#1d2939;--muted:#667085;--line:#e4e7ec;--blue:#315cf5;--green:#14805e;--orange:#b65d16}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 "Segoe UI","Microsoft YaHei",sans-serif}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}header{background:#101c30;color:white;padding:26px 4vw 32px}header a{color:#bfcfff}.brand{font-size:12px;letter-spacing:2px;color:#adc0e4}.title{font-size:30px;font-weight:700;margin:8px 0}.subtitle{color:#c1cce0;max-width:1100px}main{padding:24px 4vw 64px;max-width:1800px;margin:auto}.notice{background:#fff5df;border:1px solid #f0d497;border-radius:10px;padding:14px 18px;margin-bottom:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.stat,.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:20px}.stat strong{display:block;font-size:26px}.muted{color:var(--muted)}h2{font-size:19px;margin:0 0 16px}h3{font-size:15px;margin:0 0 8px}.panel{margin:18px 0;overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap;text-align:left}th{font-size:12px;color:var(--muted);background:#f8fafc}th,td{padding:12px 14px;border-bottom:1px solid var(--line)}.grid{display:grid;grid-template-columns:repeat(var(--method-count,4),minmax(270px,1fr));gap:14px;align-items:start;overflow-x:auto}.column{background:white;border:1px solid var(--line);border-radius:12px;min-width:0}.column-head{padding:18px;position:sticky;top:0;background:white;border-radius:12px 12px 0 0;border-top:4px solid var(--blue)}.column:nth-child(2) .column-head{border-top-color:#0c9488}.column:nth-child(3) .column-head{border-top-color:#b27b22}.column:nth-child(4) .column-head{border-top-color:#8b5bd4}.hit{padding:16px;border-top:1px solid var(--line)}.hit:hover{background:#f9fbff}.docid{font:11px/1.5 Consolas,monospace;overflow-wrap:anywhere;white-space:normal;color:#667085;margin:8px 0}.badge{display:inline-block;border-radius:5px;padding:2px 7px;font-size:11px;background:#eef2f6;margin:2px}.relevant{background:#e1f6eb;color:var(--green)}.nonrelevant{background:#ffebeb;color:#b34242}.unjudged{background:#eef0f3;color:#667085}.shared{background:#e8eeff;color:#315cf5}.rank{font-size:17px;font-weight:700;margin-right:8px}.change{color:var(--green)}.down{color:#b34242}details{margin-top:8px}summary{cursor:pointer;color:var(--blue)}.fulltext{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0}input,select,button{border:1px solid #cbd2de;background:white;border-radius:7px;padding:9px 12px;color:var(--ink);font:inherit}input{min-width:250px;flex:1}button{cursor:pointer}.links{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0}.answer{margin:0 14px 16px;padding:14px;background:#f5f7ff;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere}.barrow{display:grid;grid-template-columns:150px 1fr 65px;gap:12px;align-items:center;margin:14px 0}.bartrack{height:13px;background:#edf0f6;border-radius:8px;overflow:hidden}.bar{height:100%;background:var(--blue);border-radius:8px}.pill{font-size:12px;background:#e8edf5;border-radius:30px;padding:4px 11px}.question{font-size:16px;white-space:normal;min-width:260px}code{font-family:Consolas,monospace;overflow-wrap:anywhere}footer{color:var(--muted);margin-top:28px}.metricnote{font-size:12px;color:var(--muted)}pre{white-space:pre-wrap;word-break:break-word;font-size:12px}.extra-hit{display:none}.show-all .extra-hit{display:block}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.title{font-size:25px}.grid{grid-template-columns:repeat(var(--method-count,4),300px)}main{padding-left:16px;padding-right:16px}.barrow{grid-template-columns:120px 1fr 50px}}
.pair-view[hidden],.pair-row[hidden]{display:none}.pair-counts{display:flex;flex-wrap:wrap;gap:12px 28px;padding:12px 0;font-size:15px;font-weight:600}.pair-positive,.pair-win>strong{color:var(--green)}.pair-negative,.pair-loss>strong{color:var(--orange)}.pair-chart{max-height:580px;overflow:auto;border:1px solid var(--line);border-radius:8px}.pair-head,.pair-row{display:grid;grid-template-columns:minmax(240px,1.3fr) minmax(220px,1fr) 72px 72px 82px 48px;gap:14px;align-items:center;min-width:850px;padding:11px 14px}.pair-head{position:sticky;top:0;z-index:1;background:#f8fafc;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}.pair-row{color:var(--ink);border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}.pair-row:hover,.pair-row:focus-visible{background:#f1f5ff;text-decoration:none;outline:2px solid var(--blue);outline-offset:-2px}.pair-question>span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;line-height:1.4}.pair-question small{display:block;color:var(--muted);font:11px/1.6 Consolas,monospace;margin-top:4px}.pair-track{display:block;height:16px;position:relative;background:#eef1f5;border-radius:3px}.pair-zero{position:absolute;left:50%;top:-4px;height:24px;width:1px;background:#7c8798}.pair-bar{position:absolute;top:0;height:100%;background:var(--green);border-radius:2px}.pair-loss .pair-bar{background:var(--orange)}.pair-visible{font-size:12px;color:var(--muted)}
.drop-group[hidden],.drop-case[hidden]{display:none}.drop-categories td{white-space:normal;vertical-align:top}.drop-categories td:first-child{min-width:200px;max-width:330px}.drop-categories td:last-child{line-height:2;min-width:270px}.drop-case{border:1px solid var(--line);border-radius:8px;margin:13px 0;scroll-margin-top:18px}.drop-case>summary{padding:16px;background:#f8fafc;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--ink)}.drop-case>summary:before{content:'展开 ▸';color:var(--blue);font-size:12px}.drop-case[open]>summary:before{content:'收起 ▾'}.drop-case-title{flex:1;font-weight:600;min-width:230px}.drop-case-title small{display:block;font:11px/1.6 Consolas,monospace;color:var(--muted)}.drop-negative{color:var(--orange);margin-left:10px}.drop-body{padding:4px 20px 20px}.drop-body h4{font-size:15px;margin:22px 0 8px}.drop-table-scroll{overflow:auto}.drop-doc-title{white-space:normal;min-width:260px;max-width:500px}.drop-grade-lines .badge{min-width:25px;text-align:center}.drop-excerpt{border-left:3px solid var(--line);padding:0 14px;margin:20px 0;overflow-wrap:anywhere}.drop-visible{font-size:12px;color:var(--muted)}
.column:nth-child(5) .column-head{border-top-color:#c64874}.stage-note{padding:0 16px}</style></head><body><header><div class="brand">RAG EXPERIMENT LAB / 2024</div><div class="title">__TITLE__</div><div class="subtitle">__SUBTITLE__</div></header><main>__CONTENT__<footer>离线报告 · 每个实验保存独立数据与配置快照 · 未标注与不相关分别显示</footer></main>
<script>
const search=document.getElementById('search');if(search)search.addEventListener('input',()=>{const q=search.value.toLowerCase();document.querySelectorAll('tbody tr[data-query]').forEach(r=>r.hidden=!r.dataset.query.includes(q))});
const metric=document.getElementById('metric');if(metric){const update=()=>{document.querySelectorAll('.barrow').forEach(r=>{const v=JSON.parse(r.dataset.metrics)[metric.value];r.querySelector('.bar').style.width=v===null?'0%':Math.max(0,Math.min(100,v*100))+'%';r.querySelector('.barvalue').textContent=v===null?'N/A':v.toFixed(4)})};metric.addEventListener('change',update);update()}
const expand=document.getElementById('expand');if(expand)expand.addEventListener('click',()=>{document.body.classList.toggle('show-all');expand.textContent=document.body.classList.contains('show-all')?'仅看前列结果':'显示所有候选'});
document.querySelectorAll('a[href^="#doc-"]').forEach(a=>a.addEventListener('click',()=>{const target=document.getElementById(a.getAttribute('href').slice(1));if(target&&target.classList.contains('extra-hit')){document.body.classList.add('show-all');if(expand)expand.textContent='仅看前列结果'}}));
document.querySelectorAll('.hit').forEach(hit=>{hit.addEventListener('mouseenter',()=>{document.querySelectorAll('.hit').forEach(other=>{if(other.dataset.doc===hit.dataset.doc)other.style.background='#edf2ff'})});hit.addEventListener('mouseleave',()=>document.querySelectorAll('.hit').forEach(other=>other.style.background=''))});
const pairSelect=document.getElementById('pair-select');
if(pairSelect){
  const pairFilter=document.getElementById('pair-filter'),pairSort=document.getElementById('pair-sort');
  const pairUpdate=()=>{
    document.querySelectorAll('.pair-view').forEach(view=>{
      view.hidden=view.dataset.pair!==pairSelect.value;if(view.hidden)return;
      const rows=Array.from(view.querySelectorAll('[data-pair-row]')),container=view.querySelector('.pair-rows');
      rows.sort((a,b)=>pairSort.value==='qid'?a.dataset.qid.localeCompare(b.dataset.qid):
        ((pairSort.value==='absolute'?Math.abs(Number(b.dataset.delta))-Math.abs(Number(a.dataset.delta)):
          Number(b.dataset.delta)-Number(a.dataset.delta))||a.dataset.qid.localeCompare(b.dataset.qid)));
      let visible=0;rows.forEach(row=>{row.hidden=pairFilter.value!=='all'&&row.dataset.status!==pairFilter.value;if(!row.hidden)visible++;container.appendChild(row)});
      view.querySelector('.pair-visible').textContent=`显示 ${visible}/${rows.length} 题`;
    });
  };
  [pairSelect,pairFilter,pairSort].forEach(control=>control.addEventListener('change',pairUpdate));pairUpdate();
}
const dropMethod=document.getElementById('drop-method');
if(dropMethod){
  const dropCategory=document.getElementById('drop-category'),dropSearch=document.getElementById('drop-search');
  const dropUpdate=()=>{
    const search=dropSearch.value.toLowerCase().trim();
    document.querySelectorAll('.drop-group').forEach(group=>{
      group.hidden=group.dataset.dropMethod!==dropMethod.value;if(group.hidden)return;
      const cases=Array.from(group.querySelectorAll('.drop-case'));let visible=0;
      cases.forEach(c=>{c.hidden=(dropCategory.value!=='all'&&c.dataset.dropCategory!==dropCategory.value)||!c.dataset.dropSearch.includes(search);if(!c.hidden)visible++;});
      group.querySelector('.drop-visible').textContent=`显示 ${visible}/${cases.length} 个下降案例`;
    });
  };
  [dropMethod,dropCategory].forEach(control=>control.addEventListener('change',dropUpdate));dropSearch.addEventListener('input',dropUpdate);
  document.querySelectorAll('.drop-category-button').forEach(button=>button.addEventListener('click',()=>{dropCategory.value=button.dataset.dropCategory;dropSearch.value='';dropUpdate();}));
  const revealDrop=hash=>{const target=document.getElementById(hash.slice(1));if(!target||!target.classList.contains('drop-case'))return;
    dropMethod.value=target.closest('.drop-group').dataset.dropMethod;dropCategory.value='all';dropSearch.value='';target.open=true;dropUpdate();};
  document.querySelectorAll('.drop-case-link').forEach(link=>link.addEventListener('click',()=>revealDrop(link.hash)));
  window.addEventListener('hashchange',()=>revealDrop(window.location.hash));dropUpdate();revealDrop(window.location.hash);
}
</script></body></html>
