# Artificial fixture; keeps real TREC files and indexes isolated.
dataset:
  name: synthetic-smoke-test
  corpus: data/processed/sample/corpus.jsonl
  queries: data/processed/sample/queries.jsonl
  qrels: data/processed/sample/qrels.tsv
  manifest: data/subsets/sample/manifest.json
  raw_dir: data/raw
  max_documents: 10000
  max_queries: 20
  seed: 42
  topics_url: https://trec.nist.gov/data/rag/topics.rag24.test.txt
  qrels_url: https://trec-rag.github.io/assets/txt/qrels.rag24.test-umbrela-all.txt
  judgments: synthetic fixture labels
retrieval:
  candidate_k: 100
  context_k: 5
  display_k: 10
  index_dir: indexes/sample
  bm25: {k1: 0.9, b: 0.4, stem: true}
  bge:
    model: BAAI/bge-base-en-v1.5
    revision: main
    device: cuda
    batch_size: 8
    max_length: 512
    query_instruction: 'Represent this sentence for searching relevant passages: '
reranker:
  model: BAAI/bge-reranker-v2-m3
  revision: main
  device: cuda
  batch_size: 4
  max_length: 512
  fp16: true
evaluation: {ks: [5, 10, 20, 100], relevant_threshold: 1, gain: linear}
storage: {budget_gib: 40, reserve_gib: 20, model_cache: models/huggingface, hf_endpoint: 'https://huggingface.co'}
results_dir: results
